# WP Engine custom Nginx rules
# Picked up automatically from the WordPress root on each deploy.

# Raise the FastCGI read timeout from the default 30s to 60s.
fastcgi_read_timeout 60s;

# Block direct HTTP access to SCSS source files.
# They are tracked in git for local development/collaboration but must
# never be served to browsers in production.
location ~* \.scss$ {
    deny all;
    return 404;
}
